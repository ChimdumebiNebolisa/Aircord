[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircord"
version = "0.1.0"
description = "Aircord air-quality trust memory MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<0.142",
  "uvicorn[standard]>=0.35,<0.40",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

